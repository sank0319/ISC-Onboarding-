# JDBC connector template.
# JDBC sources run on a virtual appliance: set clusterId (here or globally above) and the connector script name.
# Copy connector + connectorAttributes from a working JDBC source with the ISC discover workflow
# (what = source, query = <source name>); credentials become secretEnv entries, never YAML values.
jdbcTemplates:
  default:
    connector: REPLACE_WITH_JDBC_SCRIPT_NAME
    clusterId: ""
    connectorAttributes: {}            # url, driver class, user, account query ... (no passwords here)
    secretEnv: {}                      # e.g. { password: JDBC_PASSWORD }: read from the environment when the source is created
    schema:
      identityAttribute: USER_ID
      displayAttribute: USER_NAME
      attributes: [USER_ID, USER_NAME, EMAIL, STATUS, ROLE]
      entitlementColumns: [ROLE]
    correlation:
      - identityAttr: uid
        accountAttr: USER_ID
