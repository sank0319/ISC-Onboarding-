# Global defaults for ISC bulk onboarding
deleteThreshold: 10
requestCommentRequired: true
updateExistingAccessProfiles: false   # true = re-apply entitlements/approvals on existing APs
aggregationTimeoutMinutes: 30
clusterId: ""                          # VA cluster ID, only for connectors that run on a VA (not needed for Delimited File)

# Connector-specific settings and templates live next to each connector, in
# onboarding/connectors/<type>/<type>-template.yaml. They are merged in when this file is loaded; a value set here wins.
