name: ISC Bulk Onboarding

on:
  pull_request:
    paths: ["onboarding/**", "!onboarding/logs/**"]  # log commits never re-trigger
  workflow_dispatch:
    inputs:
      target:
        description: "ISC tenant (GitHub environment)"
        type: choice
        options: [sandbox, production]
        default: sandbox
      apps:
        description: "Glob of app config files"
        default: "onboarding/connectors/**/*.yaml"
      wave:
        description: "Only this wave (e.g. 1 = pilot app, 2 = the rest); empty = all"
        default: ""
      apps_csv:
        description: "Optional CSV (applicationName,applicationType) selecting which apps to create"
        default: ""
      dry_run:
        description: "Plan only - no writes to ISC"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: isc-onboarding-${{ inputs.target || 'pr' }}
  cancel-in-progress: false

env:
  APPS_GLOB: ${{ inputs.apps || 'onboarding/connectors/**/*.yaml' }}
  WAVE: ${{ inputs.wave }}
  APPS_CSV: ${{ inputs.apps_csv }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Validate app configs (no API calls)
        run: python onboarding/scripts/onboard.py --apps "$APPS_GLOB" ${WAVE:+--wave "$WAVE"} ${APPS_CSV:+--apps-csv "$APPS_CSV"} --validate-only

  # On every PR: dry-run against sandbox so reviewers see exactly what will be created
  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: sandbox-readonly
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token -> Vault login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Dry-run plan
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
          VAULT_ROLE: ${{ vars.VAULT_ROLE }}
          VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
          VAULT_AUTH_MOUNT: ${{ vars.VAULT_AUTH_MOUNT }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT }}
          # fallback until Vault is set up: ignored by the script when VAULT_ADDR is set
          ISC_TENANT: ${{ secrets.ISC_TENANT }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
          ISC_BASE_URL: ${{ vars.ISC_BASE_URL }}
          ISC_TARGET: sandbox-readonly
        run: python onboarding/scripts/onboard.py --apps "$APPS_GLOB" ${WAVE:+--wave "$WAVE"} ${APPS_CSV:+--apps-csv "$APPS_CSV"} --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: plan-report, path: onboarding-report.json }
      # PR runs never push: the run log is only kept as a workflow artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-logs
          path: onboarding/logs
          if-no-files-found: ignore

  # Manual run: sandbox or production. Protect the 'production' environment with required reviewers.
  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 180
    permissions:
      contents: write  # only to commit onboarding/logs
      id-token: write  # GitHub OIDC token -> Vault login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Onboard apps
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
          VAULT_ROLE: ${{ vars.VAULT_ROLE }}
          VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
          VAULT_AUTH_MOUNT: ${{ vars.VAULT_AUTH_MOUNT }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT }}
          # fallback until Vault is set up: ignored by the script when VAULT_ADDR is set
          ISC_TENANT: ${{ secrets.ISC_TENANT }}
          ISC_CLIENT_ID: ${{ secrets.ISC_CLIENT_ID }}
          ISC_CLIENT_SECRET: ${{ secrets.ISC_CLIENT_SECRET }}
          ISC_BASE_URL: ${{ vars.ISC_BASE_URL }}
          ISC_TARGET: ${{ inputs.target }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python onboarding/scripts/onboard.py --apps "$APPS_GLOB" ${WAVE:+--wave "$WAVE"} ${APPS_CSV:+--apps-csv "$APPS_CSV"} $DRY_RUN_FLAG
      - uses: actions/upload-artifact@v4
        if: always()
        with: 
            name: onboarding-report-${{ inputs.target }}
            path: onboarding-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-logs-${{ inputs.target }}
          path: onboarding/logs
          if-no-files-found: ignore
      - name: Commit run logs
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onboarding/logs
          if git diff --cached --quiet; then
            echo "No new run logs"
            exit 0
          fi
          git commit -m "chore(logs): onboarding run ${RUN_ID} [skip ci]"
          # concurrent runs (different targets) can race on the branch: rebase and retry
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::warning::Could not push run logs to ${BRANCH} (branch protection?). They are in the onboarding-logs artifact."
